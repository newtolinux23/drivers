<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Driver Expectations & Operational Standards | FedEx Ground</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --fedex-purple: #4D148C;
            --fedex-purple-dark: #2e0959;
            --fedex-purple-light: #7b42ff;
            --fedex-orange: #FF6600;
            --fedex-green: #008A00;
            --bg-dark: #0b1120;
            --bg-card: #151f32;
            --bg-card-alt: #1b273d;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-dim: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --shadow-lg: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(77, 20, 140, 0.28), transparent 35%),
                radial-gradient(circle at 85% 25%, rgba(255, 102, 0, 0.15), transparent 35%);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes driveInTruck {
            0% { transform: translateX(-180px); opacity: 0; }
            70% { transform: translateX(8px); opacity: 1; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes roadLines {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -48; }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        /* Top Sticky Bar */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(14px);
            border-bottom: 2px solid var(--fedex-purple);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 1.45rem;
            letter-spacing: -0.8px;
        }

        .brand-fed { color: #a78bfa; }
        .brand-ex { color: var(--fedex-orange); }
        .brand-ground {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 3px 10px;
            border-radius: 999px;
            margin-left: 4px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-call {
            background: linear-gradient(135deg, var(--fedex-orange), #e65c00);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.35);
        }

        .btn-call:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-print {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
        }

        .btn-print:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Hero Section with Illustrated FedEx Step-Van Truck */
        .hero {
            position: relative;
            background: linear-gradient(135deg, #1e0b36 0%, #0f172a 55%, #1e1b4b 100%);
            border-bottom: 4px solid var(--fedex-orange);
            padding: 48px 20px 42px;
            text-align: center;
            overflow: hidden;
        }

        .hero-inner {
            max-width: 1080px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 102, 0, 0.16);
            color: #fdba74;
            border: 1px solid rgba(255, 102, 0, 0.45);
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 999px;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: clamp(1.9rem, 4.2vw, 3.1rem);
            font-weight: 900;
            margin: 0 0 12px;
            letter-spacing: -1px;
            color: #ffffff;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
        }

        .hero h1 span {
            color: var(--fedex-orange);
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.08rem;
            max-width: 720px;
            margin: 0 auto 28px;
        }

        /* Detailed FedEx Step-Van Showcase */
        .truck-showcase {
            max-width: 680px;
            margin: 10px auto 28px;
            padding: 18px 20px 10px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            border-radius: var(--radius-lg);
        }

        .fedex-truck-svg {
            width: 100%;
            max-width: 560px;
            height: auto;
            filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.6));
            animation: driveInTruck 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .road-dash {
            animation: roadLines 1.2s linear infinite;
        }

        /* Facility & Management Info Strip */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            max-width: 960px;
            margin: 0 auto;
            text-align: left;
        }

        .meta-card {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 4px solid var(--fedex-orange);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            backdrop-filter: blur(8px);
        }

        .meta-card.purple-border {
            border-left-color: #a855f7;
        }

        .meta-label {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 1.02rem;
            font-weight: 700;
            color: #fff;
        }

        .meta-sub {
            font-size: 0.86rem;
            color: #fbbf24;
            margin-top: 3px;
            font-weight: 600;
        }

        /* Main Container */
        .container {
            max-width: 1080px;
            margin: 34px auto 60px;
            padding: 0 20px;
        }

        /* Search & Quick Jump Bar */
        .control-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-lg);
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: #0b1120;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 14px;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--fedex-orange);
        }

        .step-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .step-pill {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .step-pill:hover {
            background: var(--fedex-purple);
            color: #fff;
            border-color: #a855f7;
            transform: translateY(-1px);
        }

        /* Critical Quick-Reference Code Banner */
        .code-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 32px;
        }

        .code-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }

        .code-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .code-card.code-02::before { background: var(--accent-amber); }
        .code-card.code-27::before { background: var(--accent-blue); }
        .code-card.code-85::before { background: var(--accent-red); }
        .code-card.clean-zero::before { background: var(--accent-green); }

        .code-badge {
            display: inline-block;
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .code-02 .code-badge { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
        .code-27 .code-badge { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .code-85 .code-badge { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .clean-zero .code-badge { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

        .code-card h3 {
            margin: 0 0 6px;
            font-size: 1.02rem;
            color: #fff;
        }

        .code-card p {
            margin: 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        /* Step Cards */
        .step-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            margin-bottom: 26px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: fadeUp 0.5s ease forwards;
        }

        .step-header {
            background: linear-gradient(90deg, rgba(77, 20, 140, 0.45) 0%, rgba(21, 31, 50, 0.95) 100%);
            border-bottom: 1px solid var(--border-subtle);
            padding: 20px 26px;
            display
